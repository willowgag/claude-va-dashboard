<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poste : VA courriel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Albert+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#2D142C; --card:#3A1B38; --ink:#F5E9EE; --muted:#C79AB0;
  --violet:#801336; --violet-ink:#C72C41; --wash:#510A32; --line:#5B2650;
  --ok:#2E9E6B; --alert:#EE4540;
  --disp:"Bricolage Grotesque",sans-serif; --body:"Albert Sans",sans-serif; --mono:"Spline Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse 140% 90% at 50% -10%, #C1503C 0%, #8A3540 22%, #5B1E42 45%, #2D142C 75%) fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5vw,34px);letter-spacing:-0.02em}
header h1 span{color:var(--violet)}
.pulse{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 4px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.pulse b{color:var(--ink);font-weight:500}
.pulse .dot{color:var(--violet)}
.mode-brouillon b{color:var(--violet-ink)} .mode-auto b{color:var(--ok)}
.toolbar{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap;align-items:center}
.toolbar select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--body);font-size:13.5px}
[dir=rtl] .carte{border-left:1px solid var(--line);border-right:4px solid var(--violet)}
[dir=rtl] .carte.risque-haut,[dir=rtl] .carte.pour-willow{border-right-color:var(--alert)}
[dir=rtl] .msg.client{align-self:flex-end} [dir=rtl] .msg.nous{align-self:flex-start}
button{font-family:var(--body);font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--violet)}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
button.primaire{background:var(--violet);border-color:var(--violet);color:#fff}
button.primaire:hover{background:var(--violet-ink)}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
nav button{border-radius:999px;padding:7px 15px;font-family:var(--disp);font-weight:600}
nav button.actif{background:var(--violet-ink);border-color:var(--violet-ink);color:#fff}
.carte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--violet);position:relative}
.carte .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px;word-break:break-all}
.carte .marque-tag{display:inline-block;font-family:var(--disp);font-weight:600;font-size:12px;background:var(--wash);color:var(--violet-ink);border-radius:6px;padding:2px 8px;margin-right:8px}
.carte.risque-haut{border-left-color:var(--alert)}
.risque-tag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:11px;border-radius:6px;padding:2px 9px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
.risque-tag.haut{background:#5A1418;color:#FF8A80}
.risque-tag.moyen{background:#5B3A12;color:#FFC680}
.refund-zone:empty{display:none}
.refund-panel{background:var(--paper);border:1px solid var(--violet-ink);border-radius:12px;padding:12px 14px;margin:8px 0 10px}
.refund-panel .rp-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.refund-panel .rp-head b{color:var(--ink);font-weight:500}
.refund-panel table{font-size:13px;margin-bottom:8px}
.refund-panel td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.refund-panel tr.tot td{border-top:2px solid var(--line);font-weight:600}
.refund-panel tr.rembours td{color:var(--muted)}
.refund-panel tr.dispo td{color:#FFC680;font-weight:700}
.refund-panel .rp-montant{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.refund-panel .rp-montant input{width:130px;font-family:var(--mono);font-size:15px;text-align:right}
.refund-panel .rp-confirm{margin-top:10px;padding:10px 12px;border-radius:10px;background:#5A1418;border:1px solid var(--alert);font-size:13.5px}
.refund-panel .rp-confirm .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.danger{background:var(--alert);border-color:var(--alert);color:#fff}
button.danger:hover{background:#c9362f}
.bulk-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.carte.pour-willow{border-left-color:var(--alert)}
.carte-tache{border-left-color:#C79AB0}
.tache-tag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:11px;border-radius:6px;padding:2px 9px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em;background:var(--wash);color:var(--violet-ink)}
.risque-tag.bas{background:var(--wash);color:var(--violet-ink)}
.carte h3{font-size:15px;font-weight:600;margin-bottom:4px}
.carte .resume{color:var(--muted);margin-bottom:10px}
textarea{width:100%;font-family:var(--body);font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical;min-height:44px;background:var(--paper);color:var(--ink)}
.voir-conv{background:none;border:none;color:var(--violet-ink);font-family:var(--disp);font-weight:600;font-size:13px;padding:0;margin-bottom:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.conversation{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding:10px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.msg{max-width:88%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.4;white-space:pre-wrap}
.msg .msg-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:3px}
.msg.client{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.nous{background:var(--wash);align-self:flex-end;color:var(--violet-ink)}
.conv-chargement{font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 0}
.suggestion-zone:empty{display:none}
.suggestion-box{background:var(--wash);border:1px solid var(--violet-ink);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.suggestion-box .sugg-label{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--violet-ink);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.suggestion-box .sugg-actions{margin-top:8px;display:flex;gap:8px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:var(--violet)}
.ligne-actions{display:flex;align-items:center;gap:12px;margin-top:9px;flex-wrap:wrap}
label.case{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--violet)}
input[type=text],select{font-family:var(--body);font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink)}
textarea::placeholder,input[type=text]::placeholder{color:var(--muted);opacity:.8}
.vide{color:var(--muted);text-align:center;padding:36px 10px;border:1.5px dashed var(--line);border-radius:14px}
.vide b{font-family:var(--disp);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--disp);font-weight:600;text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);font-size:12.5px}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sup{color:var(--alert);background:none;border:none;font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px}
.form-ajout{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;align-items:flex-start}
.form-ajout input[type=text]{flex:1;min-width:160px}
.panneau{background:var(--wash);border-radius:14px;padding:16px;margin-bottom:16px}
.panneau h2{font-family:var(--disp);font-size:16px;margin-bottom:10px}
.panneau .champ{margin-bottom:10px}
.panneau label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.panneau input{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--violet-ink);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.visible{opacity:1}
.chargement{color:var(--muted);font-family:var(--mono);font-size:13px;padding:20px 0}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;padding:24px 14px;display:flex;flex-direction:column;gap:4px}
.sidebar .logo{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-0.02em;padding:0 10px 20px}
.sidebar .logo span{color:var(--violet-ink)}
.sidebar button{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;background:none;border:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:14.5px;padding:11px 12px;border-radius:10px;cursor:pointer;width:100%}
.sidebar button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.sidebar button.actif{background:var(--violet-ink);color:#fff}
.sidebar button .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.content{flex:1;min-width:0;padding:24px 24px 80px;max-width:820px}
@media (max-width:760px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px 10px;gap:6px}
  .sidebar .logo{display:none}
  .sidebar button{width:auto;white-space:nowrap;padding:9px 14px}
  .content{padding:16px 14px 80px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="tabs">
    <div class="logo">Le Poste<span>.</span></div>
    <button data-tab="attente" class="actif"><span class="ic">✉</span><span data-t="aRepondre">À répondre</span></button>
    <button data-tab="remboursements"><span class="ic">⚠</span><span data-t="rembours">Remboursements</span></button>
    <button data-tab="approbations" id="tab-approb"><span class="ic">✔</span><span data-t="approb">Approbations</span></button>
    <button data-tab="afaire"><span class="ic">☑</span><span data-t="aFaire">À faire</span></button>
    <button data-tab="notes"><span class="ic">✎</span><span data-t="notes">Notes</span></button>
    <button data-tab="kb"><span class="ic">◆</span><span data-t="kb">Base de connaissances</span></button>
    <button data-tab="regles"><span class="ic">≡</span><span data-t="regles">Règles</span></button>
    <button data-tab="config"><span class="ic">⚙</span><span data-t="reglages">Réglages</span></button>
    <button data-tab="log"><span class="ic">▤</span><span data-t="journal">Journal</span></button>
  </nav>
  <div class="content">
  <header>
    <div class="pulse" id="pulse">
      <span class="dot">●</span>
      <span id="p-attente"><b>–</b> en attente</span>
      <span id="p-remb"><b>–</b> remboursements</span>
      <span id="p-tache"><b>–</b> à faire</span>
      <span id="p-approb"></span>
      <span id="p-cout"><b>–</b> ce mois-ci</span>
      <span id="p-mode"><b>–</b></span>
      <span id="role-badge" style="color:var(--violet-ink);font-weight:600"></span>
    </div>
  </header>

  <div class="toolbar">
    <button class="primaire" id="btn-run" data-t="lancerRun">Lancer un run</button>
    <button id="btn-archive" data-t="archiver">Archiver l'historique</button>
    <button id="btn-refresh" data-t="actualiser">Actualiser</button>
    <button id="btn-cfg-conn" data-t="connexion">Connexion</button>
    <select id="sel-marque" onchange="changerMarque(this.value)" title="Marque"></select>
    <select id="sel-lang" onchange="changerLangue(this.value)" title="Langue">
      <option value="fr">Français</option><option value="en">English</option><option value="ur">اردو</option>
    </select>
  </div>

  <div class="panneau" id="panneau-conn" style="display:none">
    <h2 data-t="connTitre">Connexion au moteur</h2>
    <div class="champ"><label for="in-url" data-t="connUrl">URL de l'application Web (Apps Script)</label><input type="text" id="in-url" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="champ"><label for="in-token" data-t="connJeton">Jeton du dashboard</label><input type="text" id="in-token" placeholder="…"></div>
    <div class="champ"><label for="in-nom" data-t="connNom">Ton nom (pour savoir qui a répondu quoi)</label><input type="text" id="in-nom" placeholder="ex. Willow, Sarah"></div>
    <button class="primaire" onclick="sauverConn()" data-t="connBtn">Enregistrer et connecter</button>
  </div>

  <main id="contenu"><div class="chargement" data-t="connexionEnCours">Connexion…</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

let langue = localStorage.getItem('va_lang') || 'fr';
function T(k){ return (LANGUES[langue] && LANGUES[langue][k]) || LANGUES.fr[k] || k; }
function changerLangue(l){
  langue = l; localStorage.setItem('va_lang', l);
  document.documentElement.lang = l; document.documentElement.dir = (l === 'ur') ? 'rtl' : 'ltr';
  appliquerTextesStatiques(); if(etat) rendre();
}
function appliquerTextesStatiques(){
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll('[data-tph]').forEach(el => { el.placeholder = T(el.dataset.tph); });
  const sel = $('#sel-lang'); if(sel) sel.value = langue;
}
// Resume dans la langue de l'interface. Les anciennes lignes n'ont que le francais.
// Les notes ajoutees entre crochets ([Sarah : ...], [REMBOURSE ...]) vivent sur la version francaise : on les recolle.
function resumeAffiche(x){
  const notes = (String(x.resume||'').match(/\[[^\]]+\]/g) || []).join(' ');
  const t = langue==='en' ? x.resumeEn : langue==='ur' ? x.resumeUr : '';
  if(!t) return x.resume;
  return t + (notes ? ' ' + notes : '');
}
const TYPE_LABELS = {
  fr:{adresse:"Changement d'adresse", produit:'Changement de produit', abonnement:"Annulation/modification d'abonnement"},
  en:{adresse:'Address change', produit:'Product change', abonnement:'Subscription cancel/change'},
  ur:{adresse:'پتہ تبدیلی', produit:'پروڈکٹ تبدیلی', abonnement:'سبسکرپشن منسوخی/تبدیلی'}
};
function typeLabel(t){ return (TYPE_LABELS[langue]||TYPE_LABELS.fr)[t] || t; }
let marqueFiltre = localStorage.getItem('va_marque') || '';
function changerMarque(m){ marqueFiltre = m; localStorage.setItem('va_marque', m); if(etat) rendre(); }
function filtreMarque(liste){ return marqueFiltre ? liste.filter(x => x.marque === marqueFiltre) : liste; }

let etat = null;
let tabActif = 'attente';
const $ = s => document.querySelector(s);

function conn(){ return { url: localStorage.getItem('va_url')||'', token: localStorage.getItem('va_token')||'', nom: localStorage.getItem('va_nom')||'' }; }
function sauverConn(){
  localStorage.setItem('va_url', $('#in-url').value.trim());
  localStorage.setItem('va_token', $('#in-token').value.trim());
  localStorage.setItem('va_nom', $('#in-nom').value.trim());
  $('#panneau-conn').style.display='none';
  charger();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('visible'); setTimeout(()=>t.classList.remove('visible'),2400); }

// Si le serveur refuse parce que la liste a bouge (archivage, renumerotation),
// on rafraichit tout seul au lieu de laisser Willow deviner qu'il faut cliquer Actualiser.
function gererErreur(e){
  const msg = String(e && e.message || e);
  toast(T('erreur')+' : '+msg);
  if(/actualise le tableau de bord/i.test(msg)) charger();
}

async function api(body){
  const c = conn();
  if(!c.url || !c.token){ $('#panneau-conn').style.display='block'; throw new Error('Connexion à configurer'); }
  const r = await fetch(c.url, { method:'POST', body: JSON.stringify(Object.assign({token:c.token, qui:c.nom}, body)) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.erreur || 'Erreur inconnue');
  return j;
}

const TABS_LOURDS = {kb:'kb', regles:'regles', config:'config', log:'log'};
async function charger(){
  $('#contenu').innerHTML = '<div class="chargement">'+T('chargement')+'</div>';
  try{
    // Files de travail toujours ; onglets lourds seulement si on est dessus (moins de lectures feuille par clic)
    const tabs = ['files']; if(TABS_LOURDS[tabActif]) tabs.push(TABS_LOURDS[tabActif]);
    const nouveau = await api({action:'getAll', tabs:tabs});
    if(tabActif==='notes'){ try{ nouveau.notes = (await api({action:'getNotes'})).notes; }catch(e){ nouveau.notes = []; } }
    if(etat){ ['kb','regles','config','log'].forEach(k => { if(nouveau[k] == null && etat[k] != null) nouveau[k] = etat[k]; }); }
    etat = nouveau;
    $('#p-attente').innerHTML = '<b>'+etat.attente.length+'</b> '+T('enAttente');
    const nbHaut = etat.remboursements.filter(r=>r.risque==='haut').length;
    $('#p-remb').innerHTML = '<b>'+etat.remboursements.length+'</b> '+T('remb') + (nbHaut ? ' <span style="color:var(--alert)">('+nbHaut+' '+T('aRisque')+')</span>' : '');
    $('#p-tache').innerHTML = '<b>'+etat.aFaire.length+'</b> '+T('af');
    const nbApp = (etat.approbations||[]).length;
    $('#p-approb').innerHTML = etat.role==='admin' ? '<b>'+nbApp+'</b> '+T('approbs') : '';
    $('#p-cout').innerHTML = '<b>'+etat.coutMois.toFixed(2)+' $ US</b> '+T('ceMois');
    const mode = $('#p-mode');
    mode.innerHTML = etat.autoSend ? '<b>'+T('modeAuto')+'</b>' : '<b>'+T('modeBrouillon')+'</b>';
    mode.className = etat.autoSend ? 'mode-auto' : 'mode-brouillon';
    const sel = $('#sel-marque');
    if(etat.marqueVerrouillee){
      marqueFiltre = etat.marques[0] || '';
      sel.innerHTML = `<option value="${esc(marqueFiltre)}" selected>${esc(marqueFiltre)}</option>`;
      sel.disabled = true;
    } else {
      sel.disabled = false;
      if(marqueFiltre && !(etat.marques||[]).includes(marqueFiltre)) marqueFiltre = '';
      sel.innerHTML = '<option value="">'+T('toutesMarques')+'</option>' + (etat.marques||[]).map(m=>`<option value="${esc(m)}"${m===marqueFiltre?' selected':''}>${esc(m)}</option>`).join('');
    }
    appliquerRole(etat.role);
    appliquerTextesStatiques();
    rendre();
  }catch(e){
    $('#contenu').innerHTML = '<div class="vide"><b>'+T('pasConn')+'</b><br>'+esc(e.message)+'</div>';
  }
}

function estVA(){ return etat && etat.role === 'va'; }
function appliquerRole(role){
  const admin = role !== 'va';
  document.querySelectorAll('#tabs button[data-tab="config"],#tabs button[data-tab="approbations"]')
    .forEach(b => { b.style.display = admin ? '' : 'none'; });
  $('#role-badge').textContent = admin ? '' : T('modeVA');
  $('#btn-run').style.display = admin ? '' : 'none';
  $('#btn-archive').style.display = admin ? '' : 'none';
  if(!admin && ['config','approbations'].includes(tabActif)){ tabActif='attente'; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('actif', b.dataset.tab==='attente')); }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        ${convBloc(a)}

      ${filtreMarque(etat.kb).map(k=>`<tr><td class="mono">${esc(k.marque)}</td><td>${esc(k.q)}</td><td>${esc(k.r)}</td><td><button class="sup" onclick="supprimer('delKB',${k.ligne})">${T('retirer')}</button></td></tr>`).join('')}
      </table>`;
  }

  if(tabActif==='regles'){
    if(!etat.regles) return;
    m.innerHTML = `
      <div class="form-ajout">
        <select id="rg-marque"><option>GLOBAL</option>${etat.marques.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
        <input type="text" id="rg-texte" placeholder="${T('nouvelleRegle')}">
        <button class="primaire" onclick="ajouterRegle()">${T('ajouter')}</button>
      </div>
      <table><tr><th>${T('portee')}</th><th>${T('regleCol')}</th><th></th></tr>
      ${etat.regles.filter(r=>!marqueFiltre || r.marque===marqueFiltre || r.marque==='GLOBAL').map(r=>`<tr><td class="mono">${esc(r.marque)}</td><td>${esc(r.regle)}</td><td><button class="sup" onclick="supprimer('delRegle',${r.ligne})">${T('retirer')}</button></td></tr>`).join('')}
      </table>`;
  }

  if(tabActif==='config'){
    if(!etat.config) return;
    m.innerHTML = etat.config.map(c=>`
      <div class="carte" style="border-left-color:var(--line)">
        <h3>${esc(c.param)}</h3>
        <div class="ligne-actions">
          <input type="text" id="cfg-${esc(c.param)}" value="${esc(c.valeur)}" style="flex:1;min-width:160px">
          <button onclick="sauverConfig('${esc(c.param)}')">${T('enregistrerCfg')}</button>
        </div>
      </div>`).join('') +
      '<p style="color:var(--muted);font-size:13px">'+T('cfgHint')+'</p>';
  }

  if(tabActif==='log'){
    if(!etat.log) return;
    if(!etat.log.length){ m.innerHTML='<div class="vide"><b>'+T('journalVide')+'</b></div>'; return; }
    m.innerHTML = `<table><tr><th>${T('date')}</th><th>${T('marque')}</th><th>${T('categorie')}</th><th>${T('action')}</th><th>${T('cout')}</th></tr>
      ${filtreMarque(etat.log).map(l=>`<tr><td class="mono">${esc(l.date)}</td><td>${esc(l.marque)}</td><td>${esc(l.cat)}</td><td>${esc(l.action)}</td><td class="mono">${l.cout?l.cout.toFixed(4)+' $':''}</td></tr>`).join('')}

async function envoyerReponse(ligne, tid){
  const rep = $('#rep-'+ligne).value.trim();
  if(!rep){ toast(T('ecrisDabord')); return; }
  brouillonsPerdus[tid] = rep; // conserve le texte si la ligne est refusee et que la page se rafraichit
  try{
    await api({action:'answer', ligne:ligne, tid:tid, reponse:rep, kb: $('#kb-'+ligne).checked});
    delete brouillonsPerdus[tid];
    toast(T('repEnregistree'));
    charger();
  }catch(e){ gererErreur(e); }
}
async function enregistrerToutesLesReponses(){
  const zones = document.querySelectorAll('.rep-bulk');
  const items = [];
  zones.forEach(z => {
    const texte = z.value.trim();
    if(texte){
      const ligne = Number(z.dataset.ligne);
      items.push({ ligne, tid: z.dataset.tid, sujet: z.dataset.sujet, reponse: texte, kb: document.getElementById('kb-'+ligne)?.checked || false });
    }
  });
  if(!items.length){ toast(T('aucuneRep')); return; }
  const btn = $('#btn-bulk'); btn.disabled = true; btn.textContent = T('bulkSaving');
  // Avant d'envoyer : on garde une copie de TOUT ce qui est tape, par tid.
  // Si une ligne est refusee (elle a bouge), son texte sera remis en place apres le rafraichissement.
  items.forEach(it => { brouillonsPerdus[it.tid] = it.reponse; });
  try{
    const rep = await api({action:'answerBulk', reponses: items});
    (rep.reussis || []).forEach(t => { delete brouillonsPerdus[t]; }); // on n'oublie que ce qui a vraiment ete ecrit
    const nbErr = rep.erreurs?.length || 0;
    if(nbErr){
      toast(rep.traites+' '+T('nbEnreg')+', '+nbErr+' '+T('aRefaire'));
    } else {
      toast(rep.traites+' '+T('nbEnreg'));
    }
    await charger();
  }catch(e){ gererErreur(e); }
  btn.disabled = false; btn.textContent = T('bulkBtn');
}
async function renvoyerWillow(ligne, tid){
  const note = prompt(T('renvoyerPourquoi')) || '';
  try{
    await api({action:'flagWillow', ligne:ligne, tid:tid, note:note});
    toast(T('renvoye'));

}
async function retirerLigne(ligne, tid){
  if(!confirm(T('confirmNePas'))) return;
  try{
    await api({action:'discard', ligne:ligne, tid:tid});

const cacheConv = {};
const suggestions = {};      // texte des pistes suggerees, par ligne (jamais inline dans le HTML)
const brouillonsPerdus = {}; // texte tape mais non enregistre, par tid, restaure apres un rafraichissement

async function suggererReponse(ligne, tid){
  const zone = document.getElementById('sugg-'+ligne);
  const btn = document.getElementById('btn-sugg-'+ligne);
  btn.disabled = true; btn.textContent = T('reflexion');
  try{
    const rep = await api({action:'suggestAnswer', ligne:ligne, tid:tid});
    suggestions[ligne] = String(rep.suggestion || '');
    zone.innerHTML = `
      <div class="suggestion-box">
        <div class="sugg-label">${T('piste')}</div>
        ${esc(rep.suggestion)}
        <div class="sugg-actions">
          <button class="primaire" onclick="appliquerSuggestion(${ligne})">${T('utiliser')}</button>
        </div>
      </div>`;
  }catch(e){
    zone.innerHTML = '<div class="suggestion-box">Erreur : '+esc(e.message)+'</div>';
  }
  btn.disabled = false; btn.textContent = T('suggerer');
}
function appliquerSuggestion(ligne){
  const texte = suggestions[ligne];
  if(texte == null) return;
  document.getElementById('rep-'+ligne).value = texte;
  toast(T('suggInseree'));
}

async function toggleConversation(ligne, tid){
  const box = document.getElementById('conv-'+ligne);
  const btn = document.getElementById('btn-conv-'+ligne);
  if(box.style.display !== 'none'){
    box.style.display = 'none';
    btn.textContent = T('voirConv');
    return;
  }
  box.style.display = 'flex';
  btn.textContent = T('masquerConv');
  if(cacheConv[ligne]){ box.innerHTML = cacheConv[ligne]; return; }
  box.innerHTML = '<div class="conv-chargement">'+T('convCharg')+'</div>';
  try{
    const rep = await api({action:'getThread', ligne:ligne, tid:tid});
    const html = rep.messages.map(m => `
      <div class="msg ${m.envoyeParMoi ? 'nous' : 'client'}">
        <div class="msg-meta">${esc(m.de)} · ${esc(m.date)}</div>
        ${esc(m.corps)}
      </div>`).join('');
    cacheConv[ligne] = html;
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<div class="conv-chargement">Erreur : '+esc(e.message)+'</div>';
  }
}
const apercus = {}; // detail de commande par ligne, pour ne rien re-inliner dans le HTML
function fmt(n, dev){ return (Number(n)||0).toFixed(2)+' '+(dev||''); }

async function ouvrirRemboursement(ligne, tid, montantPropose){
  const zone = document.getElementById('refund-'+ligne);
  const btn = document.getElementById('btn-refund-'+ligne);
  const va = estVA();
  if(zone.innerHTML){ zone.innerHTML=''; btn.textContent = va ? T('demanderRemb') : (montantPropose ? T('approuver') : T('rembourser')); return; }
  btn.disabled=true; btn.textContent=T('chargCommande');
  try{
    const rep = await api({action:'getRefundPreview', ligne:ligne, tid:tid});
    const c = rep.commande; apercus[ligne] = c;
    const prefill = (montantPropose && montantPropose <= c.remboursable + 0.005) ? montantPropose : c.remboursable;
    const lignesHtml = c.lignes.map(l=>`<tr><td>${esc(l.titre)}${l.variante?' <span class="meta" style="margin:0">'+esc(l.variante)+'</span>':''}</td><td class="num">${l.qte} × ${fmt(l.prixUnit)}</td><td class="num">${fmt(l.total)}</td></tr>`).join('');
    const peutExecuter = !va && c.tokenRemboursement;
    zone.innerHTML = `
      <div class="refund-panel">
        <div class="rp-head">
          <span>${T('commande')} <b>${esc(c.numero)}</b> · ${esc(c.date)}</span>
          <span><b>${esc(c.client.trim()||T('client'))}</b> · ${esc(c.email)}</span>
          <span>${T('paiement')} : <b>${esc(c.statutPaiement)}</b> · ${T('expedition')} : <b>${esc(c.statutExpedition)}</b></span>
        </div>
        <table>
          ${lignesHtml}
          <tr><td colspan="2">${T('sousTotal')}</td><td class="num">${fmt(c.sousTotal)}</td></tr>
          ${c.rabais?`<tr><td colspan="2">${T('rabais')}</td><td class="num">-${fmt(c.rabais)}</td></tr>`:''}
          <tr><td colspan="2">${T('livraison')}</td><td class="num">${fmt(c.livraison)}</td></tr>
          <tr><td colspan="2">${T('taxes')}</td><td class="num">${fmt(c.taxes)}</td></tr>
          <tr class="tot"><td colspan="2">${T('totalPaye')}</td><td class="num">${fmt(c.total, c.devise)}</td></tr>
          ${c.dejaRembourse?`<tr class="rembours"><td colspan="2">${T('dejaRemb')}</td><td class="num">-${fmt(c.dejaRembourse)}</td></tr>`:''}
          <tr class="dispo"><td colspan="2">${T('remboursable')}</td><td class="num">${fmt(c.remboursable, c.devise)}</td></tr>
        </table>
        ${(va || c.tokenRemboursement) ? `
        <div class="rp-montant">
          <label for="mt-${ligne}">${T('montantARemb')}</label>
          <input type="text" id="mt-${ligne}" value="${Number(prefill).toFixed(2)}"> <span class="meta" style="margin:0">${esc(c.devise)}</span>
          ${va
            ? `<button class="primaire" onclick="demanderRemboursement(${ligne},'${esc(tid)}')">${T('demanderCeMontant')}</button>`
            : `<button class="danger" onclick="demanderConfirmation(${ligne},'${esc(tid)}')">${T('rembCeMontant')}</button>`}
        </div>
        <div id="rp-confirm-${ligne}"></div>` :
        `<div class="meta" style="margin:0;color:var(--alert)">${esc(T('tokenManquant'))}</div>`}
      </div>`;
    btn.textContent=T('fermer');
  }catch(e){ gererErreur(e); btn.textContent = va ? T('demanderRemb') : T('rembourser'); }
  btn.disabled=false;
}

function lireMontant(ligne){
  const c = apercus[ligne]; if(!c) return null;
  const val = Number(String(document.getElementById('mt-'+ligne).value).replace(',','.'));
  if(!(val>0)){ toast(T('montantInvalide')); return null; }
  if(val > c.remboursable + 0.005){ toast(T('maxRemb')+' '+fmt(c.remboursable,c.devise)); return null; }
  return val;
}

// VA : demande, rien n'est execute
async function demanderRemboursement(ligne, tid){
  const val = lireMontant(ligne); if(val==null) return;
  const note = prompt(T('demandePourquoi')) || '';
  try{
    const rep = await api({action:'requestRefund', ligne:ligne, tid:tid, montant:val, note:note});
    toast(T('demandeEnvoyee')+' : '+fmt(rep.montant, rep.devise)+' · '+rep.numero);
    charger();
  }catch(e){ gererErreur(e); }
}

// Willow : confirmation puis execution
function demanderConfirmation(ligne, tid){
  const c = apercus[ligne]; const val = lireMontant(ligne); if(val==null) return;
  const complet = Math.abs(val - c.remboursable) < 0.01;
  document.getElementById('rp-confirm-'+ligne).innerHTML = `
    <div class="rp-confirm">
      ${T('tuVasRemb')} <b>${fmt(val, c.devise)}</b> (${complet?T('rembComplet'):T('rembPartiel')}) ${T('surCommande')} <b>${esc(c.numero)}</b> ${T('a')} <b>${esc(c.email)}</b>. ${T('irreversible')}
      <div class="btns">
        <button class="danger" onclick="confirmerRemboursement(${ligne},'${esc(tid)}',${val})">${T('ouiRemb')} ${fmt(val, c.devise)}</button>
        <button onclick="document.getElementById('rp-confirm-${ligne}').innerHTML=''">${T('annuler')}</button>
      </div>
    </div>`;
}

async function confirmerRemboursement(ligne, tid, montant){
  const box = document.getElementById('rp-confirm-'+ligne);
  box.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    const rep = await api({action:'executeRefund', ligne:ligne, tid:tid, montant:montant, confirmation:'OUI'});
    toast(T('rembFait')+' '+fmt(rep.montant, rep.devise)+' · '+rep.numero+' · '+T('courriel')+' : '+rep.courriel);
    charger();
  }catch(e){ gererErreur(e); box.querySelectorAll('button').forEach(b=>b.disabled=false); }
}
